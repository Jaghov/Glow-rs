[package]
name = "glow_flow"
version = "0.1.0"
edition = "2021"
description = "Glow normalising flow on the Burn ML framework."

[lib]
name = "glow_flow"
path = "src/lib.rs"

[[bin]]
name = "glow"
path = "src/main.rs"
required-features = ["cli"]

[features]
# Inference-only by default. Consumers bring their own Burn backend.
default = []

# Optional backend impls. Enable the one(s) matching the backend you instantiate
# `Glow` with so `Glow::inverse` (which requires `TriangularInverse`) compiles.
# Pure-forward use (`forward` / `log_likelihood`) does not need either.
backend-ndarray = ["burn/ndarray"]
backend-tch     = ["burn/tch"]

# CelebA / bouncing-ball loaders. Pulls Burn's dataset + HF/SQLite stack.
dataset = [
  "dep:image", "dep:ndarray", "dep:ndarray-npz",
  "burn/dataset", "burn/sqlite-bundled", "backend-ndarray",
]

# Training loop, sample subcommand, TOML config, JSON checkpoint metadata, LibTorch backend.
training = [
  "dataset", "backend-tch",
  "dep:toml", "dep:serde_json", "dep:image", "dep:ndarray",
]

# `glow` binary (train / sample CLI). Implies `training`.
cli = ["training", "dep:clap"]

# Live training visualisation.
rerun = ["training", "dep:rerun"]

# Finite-differences regulariser (Behrmann/Vicol "Exploding Inverses"). Enables a
# differentiable inverse path on `InvConv1x1` (per-factor Newton-Schulz on L and U)
# plus the `[regularization]` TOML block. Roughly doubles activation memory during
# training; see CLAUDE.md.
fd_reg = []

[dependencies]
# Library core. Backend impls (`ndarray`, `tch`, `cuda`, `wgpu`) are gated behind
# the features above; library consumers compose with their own backend.
burn = { version = "0.20", default-features = false, features = ["std", "autodiff"] }
serde = { version = "1.0.219", features = ["derive"] }

# Application-only deps, all optional.
clap = { version = "4", features = ["derive"], optional = true }
toml = { version = "0.8", optional = true }
serde_json = { version = "1", optional = true }
image = { version = "0.25", optional = true }
ndarray = { version = "0.16.1", optional = true }
ndarray-npz = { version = "0.4.2", optional = true }
rerun = { version = "0.31", features = ["run", "native_viewer"], optional = true }

[dev-dependencies]
# Tests run against the NdArray CPU backend.
burn = { version = "0.20", default-features = false, features = ["std", "autodiff", "ndarray"] }
rstest = "0.26.1"
